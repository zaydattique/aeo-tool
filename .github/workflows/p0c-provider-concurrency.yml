name: P0-C provider concurrency hardening

on:
  push:
    branches:
      - phase0c-provider-concurrency
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run lib/__tests__/visibility-hardening.test.ts
      - run: npx tsc --noEmit
