name: P0-I provider cost isolation

on:
  pull_request:
    paths:
      - "lib/provider-budget.ts"
      - "lib/provider-budget.ts"
      - "lib/scan-worker.ts"
      - "lib/ai-analysis.ts"
      - "lib/crawl.ts"
      - "lib/__tests__/provider-budget.test.ts"
      - ".env.example"
      - ".github/workflows/p0i-provider-cost-isolation.yml"
  push:
    branches: ["main"]
    paths:
      - "lib/provider-budget.ts"
      - "lib/scan-worker.ts"
      - "lib/ai-analysis.ts"
      - "lib/crawl.ts"
      - "lib/__tests__/provider-budget.test.ts"
      - ".env.example"
      - ".github/workflows/p0i-provider-cost-isolation.yml"

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx prisma generate
      - run: npx vitest run lib/__tests__/provider-budget.test.ts lib/__tests__/rate-limit.test.ts lib/__tests__/url-and-safe-fetch.test.ts
      - run: npx tsc --noEmit
