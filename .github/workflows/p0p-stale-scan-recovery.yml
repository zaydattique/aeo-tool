name: P0-P stale scan recovery

on:
  push:
    branches: [main, phase0p-stale-scan-recovery]
  pull_request:
    branches: [main]

jobs:
  stale-recovery:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx vitest run lib/__tests__/scan-recovery.test.ts
      - run: npx tsc --noEmit
