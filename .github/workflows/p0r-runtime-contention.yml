name: P0-R runtime contention hardening

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, phase0r-runtime-contention-hardening]

jobs:
  runtime-hardening:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx vitest run lib/__tests__/provider-budget.test.ts lib/__tests__/rate-limit.test.ts lib/__tests__/visibility-hardening.test.ts
      - run: npx tsc --noEmit
