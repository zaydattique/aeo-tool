name: P0-L cursor pagination and query load

on:
  push:
    branches: [main, phase0l-cursor-pagination-load]
  pull_request:
    branches: [main]

jobs:
  pagination:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx vitest run lib/__tests__/cursor-pagination.test.ts
      - run: npx tsc --noEmit
