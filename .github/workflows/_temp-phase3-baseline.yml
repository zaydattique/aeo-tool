name: Temporary Phase 3 baseline generator
permissions:
  contents: write

on:
  push:
    branches: [phase3-canonical-analytics-data-foundation]
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npx prisma generate
      - name: Generate baseline SQL
        run: |
          mkdir -p /tmp/baseline
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /tmp/baseline/migration.sql
      - name: Commit generated baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp /tmp/baseline/migration.sql prisma/migrations/00000000000000_baseline/migration.sql
          cat >> prisma/migrations/00000000000000_baseline/migration.sql <<'SQL'

-- Preserve the production concurrency invariant that Prisma schema cannot express.
CREATE UNIQUE INDEX "Scan_one_active_per_client"
ON "Scan" ("clientId")
WHERE "status" IN ('QUEUED', 'RUNNING');

-- Metric observations are historical evidence, not mutable state.
CREATE OR REPLACE FUNCTION prevent_metric_observation_mutation()
RETURNS trigger
LANGUAGE plpgsql
AS $
BEGIN
  RAISE EXCEPTION 'METRIC_OBSERVATION_IMMUTABLE';
END;
$;

CREATE TRIGGER metric_observation_immutable
BEFORE UPDATE OR DELETE ON "MetricObservation"
FOR EACH ROW
EXECUTE FUNCTION prevent_metric_observation_mutation();
SQL
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/00000000000000_baseline/migration.sql
          git commit -m "chore: add generated Prisma baseline" || true
          git push origin HEAD:phase3-canonical-analytics-data-foundation
