name: P0-D abuse hardening

on:
  push:
    branches:
      - phase0d-abuse-hardening
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # P0-D verification: rate-limit + visibility hardening
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prisma generate
      - run: npx vitest run lib/__tests__/rate-limit.test.ts lib/__tests__/visibility-hardening.test.ts
      - run: npx tsc --noEmit
