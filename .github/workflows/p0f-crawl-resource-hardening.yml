name: P0-F crawl resource hardening

on:
  push:
    branches:
      - phase0f-crawl-resource-hardening
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx prisma generate
      - run: npx vitest run lib/__tests__/url-and-safe-fetch.test.ts
      - run: npx tsc --noEmit
